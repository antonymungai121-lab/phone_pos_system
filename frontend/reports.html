<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhonePOS &mdash; Reports</title>
  <meta name="description" content="Sales history, revenue reports, and business analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
      <span class="logo-label">PhonePOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item " data-page="dashboard"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span></a>
      <a href="pos.html"       class="nav-item "       data-page="pos">      <span class="nav-icon"><i class="fa-solid fa-cash-register"></i></span><span class="nav-label">Point of Sale</span></a>
      <a href="inventory.html" class="nav-item " data-page="inventory"><span class="nav-icon"><i class="fa-solid fa-boxes-stacked"></i></span><span class="nav-label">Inventory</span></a>
      <a href="products.html"  class="nav-item "  data-page="products"> <span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span><span class="nav-label">Products</span></a>
      <a href="reports.html"   class="nav-item active"   data-page="reports">  <span class="nav-icon"><i class="fa-solid fa-chart-bar"></i></span><span class="nav-label">Reports</span></a>
      <a href="users.html"     class="nav-item "     data-page="users">    <span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Users</span></a>
      <a href="shops.html"     class="nav-item "     data-page="shops">    <span class="nav-icon"><i class="fa-solid fa-store"></i></span><span class="nav-label">Branches</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="myAccountTrigger" title="My Account">
        <span class="user-avatar" id="userAvatar">?</span>
        <div class="user-info">
          <span class="user-name" id="sidebarUsername">&mdash;</span>
          <span class="user-role" id="sidebarRole">&mdash;</span>
        </div>
      </div>
      <button id="logoutBtn" class="btn-logout" title="Logout"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Reports</h1>
        <span class="shop-badge" id="shopBadge">&mdash;</span>
      </div>
      <div class="topbar-right">
        <input type="date" id="filterDate" />
        <select id="filterPayment">
          <option value="">All Payments</option>
          <option value="cash">Cash</option>
          <option value="mpesa">M-Pesa</option>
          <option value="card">Card</option>
        </select>
        <span id="topbarTime" class="topbar-time"></span>
      </div>
    </header>

    <!-- Revenue KPIs -->
    <div class="kpi-grid" style="grid-template-columns: repeat(3, 1fr)">
      <div class="kpi-card glass">
        <span class="kpi-icon"><i class="fa-solid fa-money-bill-wave"></i></span>
        <div class="kpi-body">
          <span class="kpi-value kpi-revenue" id="rptTotal">KES &mdash;</span>
          <span class="kpi-label">Total Revenue</span>
        </div>
      </div>
      <div class="kpi-card glass">
        <span class="kpi-icon"><i class="fa-solid fa-receipt"></i></span>
        <div class="kpi-body">
          <span class="kpi-value" id="rptCount">&mdash;</span>
          <span class="kpi-label">Total Sales</span>
        </div>
      </div>
      <div class="kpi-card glass">
        <span class="kpi-icon"><i class="fa-solid fa-chart-pie"></i></span>
        <div class="kpi-body">
          <span class="kpi-value kpi-revenue" id="rptAvg">KES &mdash;</span>
          <span class="kpi-label">Avg Sale Value</span>
        </div>
      </div>
    </div>

    <!-- Full sales history table -->
    <div class="card glass">
      <div class="card-header">
        <h2 class="card-title">Sales History</h2>
        <span class="txt-muted" id="rptFilterLabel"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="salesTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Sale ID</th>
              <th>IMEI / Serial</th>
              <th>Cashier</th>
              <th>Amount (KES)</th>
              <th>Payment</th>
              <th>Date &amp; Time</th>
            </tr>
          </thead>
          <tbody id="salesTbody">
            <tr><td colspan="7" class="table-empty">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
