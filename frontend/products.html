<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhonePOS &mdash; Products</title>
  <meta name="description" content="Manage phone and accessory product catalogue." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
      <span class="logo-label">PhonePOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item " data-page="dashboard"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span></a>
      <a href="pos.html"       class="nav-item "       data-page="pos">      <span class="nav-icon"><i class="fa-solid fa-cash-register"></i></span><span class="nav-label">Point of Sale</span></a>
      <a href="inventory.html" class="nav-item " data-page="inventory"><span class="nav-icon"><i class="fa-solid fa-boxes-stacked"></i></span><span class="nav-label">Inventory</span></a>
      <a href="products.html"  class="nav-item active"  data-page="products"> <span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span><span class="nav-label">Products</span></a>
      <a href="reports.html"   class="nav-item "   data-page="reports">  <span class="nav-icon"><i class="fa-solid fa-chart-bar"></i></span><span class="nav-label">Reports</span></a>
      <a href="users.html"     class="nav-item "     data-page="users">    <span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Users</span></a>
      <a href="shops.html"     class="nav-item "     data-page="shops">    <span class="nav-icon"><i class="fa-solid fa-store"></i></span><span class="nav-label">Branches</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="myAccountTrigger" title="My Account">
        <span class="user-avatar" id="userAvatar">?</span>
        <div class="user-info">
          <span class="user-name" id="sidebarUsername">&mdash;</span>
          <span class="user-role" id="sidebarRole">&mdash;</span>
        </div>
      </div>
      <button id="logoutBtn" class="btn-logout" title="Logout"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Products</h1>
        <span class="shop-badge" id="shopBadge">&mdash;</span>
      </div>
      <div class="topbar-right">
        <button id="openAddProductModal" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-plus"></i> Add Product
        </button>
      </div>
    </header>

    <div class="card glass">
      <div class="card-header">
        <h2 class="card-title">Product Catalogue</h2>
        <input type="search" id="productSearch" placeholder="Search products&hellip;" style="max-width:220px" />
      </div>
      <div class="table-wrap">
        <table class="data-table" id="productsTable">
          <thead>
            <tr><th>#</th><th>Brand</th><th>Model</th><th>Price (KES)</th><th>Actions</th></tr>
          </thead>
          <tbody id="productsTbody">
            <tr><td colspan="5" class="table-empty">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Product Modal -->
  <div id="addProductModal" class="modal-overlay hidden" role="dialog">
    <div class="modal-box glass">
      <div class="modal-header">
        <h3 id="productModalTitle">Add Product</h3>
        <button class="modal-close" data-close="addProductModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="addProductForm" class="pos-form">
        <input type="hidden" id="editProductId" value="" />
        <div class="form-group">
          <label for="productBrand">Brand</label>
          <input type="text" id="productBrand" placeholder="e.g. Samsung" required />
        </div>
        <div class="form-group">
          <label for="productModel">Model</label>
          <input type="text" id="productModel" placeholder="e.g. Galaxy A55" required />
        </div>
        <div class="form-group">
          <label for="productPrice">Selling Price (KES)</label>
          <input type="number" id="productPrice" placeholder="e.g. 35000" min="1" step="0.01" required />
        </div>
        <div id="productError" class="alert alert-error hidden"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="addProductModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="productSubmitBtn">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
