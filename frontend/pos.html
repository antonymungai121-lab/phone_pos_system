<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhonePOS &mdash; Point of Sale</title>
  <meta name="description" content="Process phone and accessory sales with real-time IMEI tracking." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .imei-autofill {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: rgba(56,189,248,.08);
      border: 1px solid rgba(56,189,248,.25);
      font-size: .85rem;
      color: var(--clr-primary);
      margin-bottom: 4px;
      display: none;
    }
    .imei-autofill.visible { display: block; }
    .price-suggested { font-size: .75rem; color: var(--txt-muted); margin-top: 2px; }
    .receipt-panel {
      display: flex; flex-direction: column; gap: 0;
    }
    .receipt-header {
      text-align: center; padding: 16px 0 10px;
      border-bottom: 1px dashed var(--clr-border);
    }
    .receipt-header h3 { font-size: 1rem; font-weight: 700; }
    .receipt-header p  { font-size: .78rem; color: var(--txt-muted); }
    .receipt-row {
      display: flex; justify-content: space-between; padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,.04); font-size: .85rem;
    }
    .receipt-row .rl { color: var(--txt-muted); }
    .receipt-row .rv { font-weight: 600; }
    .receipt-total {
      display: flex; justify-content: space-between; padding: 12px 0 0;
      font-weight: 800; font-size: 1.05rem; color: var(--clr-primary);
    }
    .receipt-empty { text-align: center; color: var(--txt-muted); padding: 30px 0; font-size: .88rem; }
  </style>
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
      <span class="logo-label">PhonePOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item " data-page="dashboard"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span></a>
      <a href="pos.html" class="nav-item active" data-page="pos"><span class="nav-icon"><i class="fa-solid fa-cash-register"></i></span><span class="nav-label">Point of Sale</span></a>
      <a href="inventory.html" class="nav-item " data-page="inventory"><span class="nav-icon"><i class="fa-solid fa-boxes-stacked"></i></span><span class="nav-label">Inventory</span></a>
      <a href="products.html" class="nav-item " data-page="products"><span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span><span class="nav-label">Products</span></a>
      <a href="reports.html" class="nav-item " data-page="reports"><span class="nav-icon"><i class="fa-solid fa-chart-bar"></i></span><span class="nav-label">Reports</span></a>
      <a href="users.html" class="nav-item " data-page="users"><span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Users</span></a>
      <a href="shops.html" class="nav-item " data-page="shops"><span class="nav-icon"><i class="fa-solid fa-store"></i></span><span class="nav-label">Branches</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="myAccountTrigger" title="My Account">
        <span class="user-avatar" id="userAvatar">?</span>
        <div class="user-info">
          <span class="user-name" id="sidebarUsername">&mdash;</span>
          <span class="user-role" id="sidebarRole">&mdash;</span>
        </div>
      </div>
      <button id="logoutBtn" class="btn-logout" title="Logout"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Point of Sale</h1>
        <span class="shop-badge" id="shopBadge">&mdash;</span>
      </div>
      <div class="topbar-right">
        <span id="topbarTime" class="topbar-time"></span>
      </div>
    </header>

    <div class="pos-layout">
      <!-- Phone sale panel -->
      <div class="card glass">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-mobile-screen-button"></i> Sell Phone by IMEI</h2>
        </div>
        <form id="imeiForm" class="pos-form">
          <div class="form-group">
            <label for="imeiInput">IMEI Number</label>
            <input type="text" id="imeiInput" placeholder="Scan or type 15-digit IMEI"
                   maxlength="15" autocomplete="off" required />
          </div>

          <!-- Auto-fill info box (shown after IMEI lookup) -->
          <div class="imei-autofill" id="imeiFillInfo">
            <i class="fa-solid fa-circle-check"></i>
            <span id="imeiFillText"></span>
          </div>

          <div class="form-group">
            <label for="imeiSalePrice">Sale Price (KES)</label>
            <input type="number" id="imeiSalePrice" placeholder="e.g. 15000" min="1" step="0.01" required />
            <span class="price-suggested" id="priceSuggested"></span>
          </div>
          <div class="form-group">
            <label for="imeiPayment">Payment Method</label>
            <select id="imeiPayment">
              <option value="cash">Cash</option>
              <option value="mpesa">M-Pesa</option>
              <option value="card">Card</option>
            </select>
          </div>
          <div id="imeiError" class="alert alert-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-full" id="imeiCheckoutBtn">
            <i class="fa-solid fa-cash-register"></i> Process Sale
          </button>
        </form>
      </div>

      <!-- Accessory sale panel -->
      <div class="card glass">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-plug"></i> Sell Accessory</h2>
        </div>
        <form id="accessoryForm" class="pos-form">
          <div class="form-group">
            <label for="accProduct">Select Product</label>
            <select id="accProduct" required>
              <option value="">— select product —</option>
            </select>
          </div>
          <div class="form-group">
            <label for="accSalePrice">Sale Price (KES)</label>
            <input type="number" id="accSalePrice" placeholder="e.g. 500" min="1" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="accPayment">Payment Method</label>
            <select id="accPayment">
              <option value="cash">Cash</option>
              <option value="mpesa">M-Pesa</option>
              <option value="card">Card</option>
            </select>
          </div>
          <div id="accError" class="alert alert-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-full" id="accCheckoutBtn">
            <i class="fa-solid fa-basket-shopping"></i> Sell Accessory
          </button>
        </form>
      </div>

      <!-- Receipt panel -->
      <div class="card glass receipt-panel">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-receipt"></i> Receipt</h2>
        </div>
        <div class="receipt-header">
          <h3 id="receiptShopName">PhonePOS</h3>
          <p id="receiptDateTime">&mdash;</p>
        </div>
        <div id="receiptEmpty" class="receipt-empty">
          <i class="fa-regular fa-file-lines" style="font-size:2rem;opacity:.3"></i><br>
          No sale processed yet
        </div>
        <div id="receiptBody" style="display:none">
          <div class="receipt-row"><span class="rl">Item</span><span class="rv" id="rItem">—</span></div>
          <div class="receipt-row"><span class="rl">Cashier</span><span class="rv" id="rCashier">—</span></div>
          <div class="receipt-row"><span class="rl">Payment</span><span class="rv" id="rPayment">—</span></div>
          <div class="receipt-total"><span>Total</span><span id="rAmount">—</span></div>
          <button class="btn btn-ghost btn-sm btn-full" id="printReceiptBtn" style="margin-top:14px">
            <i class="fa-solid fa-print"></i> Print Receipt
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
